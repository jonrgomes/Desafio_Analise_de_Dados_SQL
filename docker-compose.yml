services:
  postgres:
    image: postgres:16-alpine
    container_name: desafio_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: db_vendas
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: adminpassword
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
